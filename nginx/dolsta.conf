# Config nginx pour DOLSTA — à copier dans ~/app/nginx/dolsta.conf sur le VPS
# et à monter dans le conteneur nginx sur /etc/nginx/conf.d/dolsta.conf
# Remplace dolsta.fr partout si ton domaine est différent.

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dolsta.fr www.dolsta.fr;
    return 301 https://dolsta.fr$request_uri;
}

# www -> domaine principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dolsta.fr;

    ssl_certificate /etc/letsencrypt/live/dolsta.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dolsta.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://dolsta.fr$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dolsta.fr;

    ssl_certificate /etc/letsencrypt/live/dolsta.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dolsta.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Résolution au moment de la requête (DNS interne de Docker) :
    # si le conteneur DOLSTA est arrêté, nginx démarre quand même et ton autre app reste en ligne.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $dolsta http://dolsta:4321;

    location /_astro/ {
        proxy_pass $dolsta;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass $dolsta;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
